[package]
name = "recorde"
version = "0.1.0"
edition = "2021"

[lib]
name = "recorde"
path = "src/lib.rs"

[[bin]]
name = "recorde"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.28"
git2 = { version = "0.19", features = ["vendored-libgit2"] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
log = "0.4"
env_logger = "0.11"
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
eframe = { path = "vendor/eframe" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
