[package]
name = "recorde"
version = "0.3.7"
edition = "2021"
authors = ["Antony Doyle <antony@siege21.com>"]
description = "A cross-platform desktop Git client built with Rust"
homepage = "https://antonydoyle.com"
repository = "https://github.com/antonydoyle/Recorde"

[lib]
name = "recorde"
path = "src/lib.rs"

[[bin]]
name = "recorde"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.28"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
log = "0.4"
env_logger = "0.11"
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
eframe = { path = "vendor/eframe" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
section = "devel"
priority = "optional"
depends = "$auto, libgl1, libgtk-3-0, libglib2.0-0, libfontconfig1, libfreetype6"
assets = [
    ["target/release/recorde",    "usr/bin/recorde",                                          "755"],
    ["assets/icon.png",           "usr/share/icons/hicolor/256x256/apps/recorde.png",         "644"],
    ["packaging/recorde.desktop", "usr/share/applications/recorde.desktop",                   "644"],
]

[package.metadata.wix]
upgrade-guid = "F8B2C4E6-A3D5-4F7E-9B2C-6E8A1C3F5B7D"
path-guid    = "A9C1E3F5-B7D9-4E6F-8A2C-1B3D5E7F9A2C"
license      = false
eula         = false
