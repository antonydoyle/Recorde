[package]
name = "recorde"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "recorde"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.28"
git2 = { version = "0.19", features = ["vendored-libgit2"] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
