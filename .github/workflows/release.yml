name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate-code:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  # ── Semver tag validation ─────────────────────────────────────────────────────
  validate-tag:
    name: Validate semver tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check tag format
        id: version
        shell: bash
        run: |
          tag="v$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then tag="${GITHUB_REF_NAME}"; fi
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${tag}' is not a valid semver tag (expected v1.2.3, v1.2.3-rc.1, etc.)" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
      - name: Check manifest version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['package']['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Release tag must match Cargo.toml version'
          PY

  # ── Linux: portable .tar.gz  +  .deb  +  .AppImage ──────────────────────────
  build-linux:
    name: Linux x86_64
    needs: validate-tag
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
      # Public client IDs of Recorde's OAuth apps, read by build.rs.
      RECORDE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.RECORDE_GITHUB_OAUTH_CLIENT_ID }}
      RECORDE_GITLAB_OAUTH_CLIENT_ID: ${{ secrets.RECORDE_GITLAB_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config patchelf squashfs-tools \
            libssl-dev \
            libgtk-3-dev libglib2.0-dev \
            libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # Release binaries are built without restoring compiled dependency caches.

      - name: Build release binary
        run: cargo build --release --locked

      # ── Portable tar.gz ───────────────────────────────────────────────────
      - name: Package portable tar.gz
        run: |
          mkdir -p dist
          package="recorde-${VERSION}-linux-x86_64"
          stage="$RUNNER_TEMP/portable/$package"
          mkdir -p "$stage/licenses"
          cp target/release/recorde "$stage/"
          cp packaging/install-portable.json "$stage/recorde-install.json"
          cp README.md LICENSE packaging/recorde.desktop "$stage/"
          cp assets/icon.png "$stage/recorde.png"
          cp assets/fonts/*-*.txt "$stage/licenses/"
          tar -czf "dist/$package.tar.gz" -C "$RUNNER_TEMP/portable" "$package"

      # ── .deb installer ────────────────────────────────────────────────────
      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.8.0 --locked

      - name: Build .deb
        run: |
          cargo build --release --locked --manifest-path tools/update-installer/Cargo.toml
          cargo deb --no-build

      - name: Rename .deb
        run: |
          DEB=$(ls target/debian/*.deb | head -1)
          cp "$DEB" "dist/recorde_${VERSION}_amd64.deb"

      - name: Download installer upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.3.10 --repo "$GITHUB_REPOSITORY" --pattern 'recorde_0.3.10_amd64.deb' --pattern SHA256SUMS --dir "$RUNNER_TEMP/installer-baseline"
      - name: Verify DEB installation and upgrade
        run: |
          python3 scripts/check_process_safety.py
          python3 scripts/linux_task.py --purpose 'Release DEB acceptance' --artifacts "$RUNNER_TEMP/process-safety" --timeout 900 -- python3 scripts/linux_installer_acceptance.py --previous "$RUNNER_TEMP/installer-baseline/recorde_0.3.10_amd64.deb" --checksums "$RUNNER_TEMP/installer-baseline/SHA256SUMS" --candidate "dist/recorde_${VERSION}_amd64.deb" --binary target/release/recorde --artifacts "$RUNNER_TEMP/installer-acceptance"
      - name: Verify isolated privileged updater on disposable runner
        run: |
          cargo build --release --locked --manifest-path tools/update-signing/Cargo.toml
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_WORKSPACE,RUNNER_TEMP "$pythonLocation/bin/python3" scripts/linux_task.py --purpose 'Signed DEB helper acceptance' --artifacts "$RUNNER_TEMP/privileged-process-safety" --timeout 3600 -- "$pythonLocation/bin/python3" scripts/linux_update_installer_acceptance.py --previous "$RUNNER_TEMP/installer-baseline/recorde_0.3.10_amd64.deb" --checksums "$RUNNER_TEMP/installer-baseline/SHA256SUMS" --candidate "dist/recorde_${VERSION}_amd64.deb" --binary target/release/recorde --helper tools/update-installer/target/release/recorde-update-installer --signer tools/update-signing/target/release/recorde-update-signing --artifacts "$RUNNER_TEMP/privileged-installer-acceptance"
      - name: Make privileged acceptance ledgers readable for upload
        if: always()
        run: |
          for name in privileged-process-safety privileged-installer-acceptance; do
            path="$RUNNER_TEMP/$name"
            if [[ -d "$path" && ! -L "$path" ]]; then
              sudo chown -R --no-dereference "$(id -u):$(id -g)" "$path"
            fi
          done
      - name: Upload Linux installer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-installer-evidence
          path: |
            ${{ runner.temp }}/installer-acceptance
            ${{ runner.temp }}/process-safety
            ${{ runner.temp }}/privileged-process-safety
            ${{ runner.temp }}/privileged-installer-acceptance

      # ── AppImage ──────────────────────────────────────────────────────────
      - name: Build AppImage
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum --check --strict
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp target/release/recorde                   AppDir/usr/bin/recorde
          cp packaging/recorde.desktop                AppDir/usr/share/applications/recorde.desktop
          cp assets/icon.png                          AppDir/usr/share/icons/hicolor/256x256/apps/recorde.png
          cp assets/icon.png                          AppDir/recorde.png
          cp packaging/recorde.desktop                AppDir/recorde.desktop
          mkdir -p AppDir/usr/share/doc/recorde/licenses
          cp assets/fonts/*-*.txt AppDir/usr/share/doc/recorde/licenses/

          printf '#!/bin/bash\nAPPDIR="$(dirname "$(readlink -f "$0")")"\nexec "$APPDIR/usr/bin/recorde" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            AppDir "dist/Recorde-${VERSION}-x86_64.AppImage"

      - name: Stage portable update binary
        run: cp target/release/recorde "dist/recorde-${VERSION}-linux-x86_64"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-artifacts
          path: dist/
          if-no-files-found: error

  # ── Windows: portable .zip  +  .msi installer ────────────────────────────────
  # Note: no --target flag; windows-latest default IS x86_64-pc-windows-msvc
  # and output goes to target\release\ which avoids path resolution issues.
  build-windows:
    name: Windows x86_64
    needs: validate-tag
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
      # Public client IDs of Recorde's OAuth apps, read by build.rs.
      RECORDE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.RECORDE_GITHUB_OAUTH_CLIENT_ID }}
      RECORDE_GITLAB_OAUTH_CLIENT_ID: ${{ secrets.RECORDE_GITLAB_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # Release binaries are built without restoring compiled dependency caches.

      - name: Build release binary
        run: cargo build --release --locked

      # ── Portable .zip ─────────────────────────────────────────────────────
      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $dir = "$env:RUNNER_TEMP\portable\recorde-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $dir
          Copy-Item target\release\recorde.exe $dir\
          Copy-Item packaging\install-portable.json "$dir\recorde-install.json"
          Copy-Item README.md, LICENSE $dir\
          New-Item -ItemType Directory -Path "$dir\licenses"
          Copy-Item assets\fonts\*-*.txt "$dir\licenses\"
          Compress-Archive -Path $dir -DestinationPath "dist\recorde-$env:VERSION-windows-x86_64.zip"

      # ── MSI installer ─────────────────────────────────────────────────────
      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Build MSI
        run: cargo wix --no-build --nocapture

      - name: Rename MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem target\wix\*.msi | Select-Object -First 1
          Copy-Item $msi.FullName "dist\recorde-$env:VERSION-windows-x86_64.msi"

      - name: Download installer upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release download v0.3.10 --repo $env:GITHUB_REPOSITORY --pattern 'recorde-0.3.10-windows-x86_64.msi' --pattern SHA256SUMS --dir "$env:RUNNER_TEMP/installer-baseline"
      - name: Verify MSI installation and upgrade
        shell: pwsh
        run: |
          python scripts/check_process_safety.py
          ./scripts/windows_task.ps1 -Executable pwsh -Arguments @('-NoProfile', '-File', './scripts/windows_installer_acceptance.ps1', '-PreviousMsi', "$env:RUNNER_TEMP/installer-baseline/recorde-0.3.10-windows-x86_64.msi", '-PreviousChecksums', "$env:RUNNER_TEMP/installer-baseline/SHA256SUMS", '-CandidateMsi', "dist/recorde-$env:VERSION-windows-x86_64.msi", '-ExpectedBinary', 'target/release/recorde.exe', '-Artifacts', "$env:RUNNER_TEMP/installer-acceptance") -Purpose 'Release MSI acceptance' -Artifacts "$env:RUNNER_TEMP/process-safety" -TimeoutSeconds 900
      - name: Upload Windows installer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer-evidence
          path: |
            ${{ runner.temp }}/installer-acceptance
            ${{ runner.temp }}/process-safety
      - name: Stage portable update binary
        shell: pwsh
        run: Copy-Item target/release/recorde.exe "dist/recorde-$env:VERSION-windows-x86_64.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-artifacts
          path: dist/
          if-no-files-found: error

  # ── macOS: universal binary → portable .tar.gz  +  .dmg installer ───────────
  # Single macos-latest (ARM) job that cross-compiles x86_64 too, then lipo.
  # Avoids the slow / stalled macos-13 runner queue.
  build-macos:
    name: macOS (universal)
    needs: validate-tag
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
      # Public client IDs of Recorde's OAuth apps, read by build.rs.
      RECORDE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.RECORDE_GITHUB_OAUTH_CLIENT_ID }}
      RECORDE_GITLAB_OAUTH_CLIENT_ID: ${{ secrets.RECORDE_GITLAB_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install cmake
        run: brew install cmake

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Release binaries are built without restoring compiled dependency caches.

      - name: Build aarch64
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/recorde \
            target/x86_64-apple-darwin/release/recorde \
            -output recorde-universal
          chmod +x recorde-universal
          lipo -info recorde-universal

      # ── Portable tar.gz ───────────────────────────────────────────────────
      - name: Package portable tar.gz
        run: |
          mkdir -p dist
          mkdir -p "recorde-${VERSION}-macos-universal"
          cp recorde-universal "recorde-${VERSION}-macos-universal/recorde"
          cp README.md LICENSE "recorde-${VERSION}-macos-universal/"
          mkdir -p "recorde-${VERSION}-macos-universal/licenses"
          cp assets/fonts/*-*.txt "recorde-${VERSION}-macos-universal/licenses/"
          tar -czf "dist/recorde-${VERSION}-macos-universal.tar.gz" "recorde-${VERSION}-macos-universal/"

      # ── .app bundle + .dmg installer ──────────────────────────────────────
      - name: Create .icns icon
        run: |
          mkdir -p Recorde.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets/icon.png --out "Recorde.iconset/icon_${size}x${size}.png"       2>/dev/null
            double=$((size * 2))
            sips -z $double $double assets/icon.png --out "Recorde.iconset/icon_${size}x${size}@2x.png" 2>/dev/null
          done
          iconutil -c icns Recorde.iconset -o recorde.icns

      - name: Build .app bundle
        run: |
          APP="Recorde.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"
          cp recorde-universal "${APP}/Contents/MacOS/recorde"
          cp recorde.icns       "${APP}/Contents/Resources/icon.icns"
          mkdir -p "${APP}/Contents/Resources/licenses"
          cp assets/fonts/*-*.txt "${APP}/Contents/Resources/licenses/"
          sed "s/RECORDE_VERSION/${VERSION}/g" packaging/Info.plist > "${APP}/Contents/Info.plist"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build .dmg
        run: |
          create-dmg \
            --volname "Recorde ${VERSION}" \
            --volicon recorde.icns \
            --window-pos 200 120 \
            --window-size 580 400 \
            --icon-size 100 \
            --icon "Recorde.app" 160 185 \
            --hide-extension "Recorde.app" \
            --app-drop-link 420 185 \
            "dist/Recorde-${VERSION}-macos-universal.dmg" \
            "Recorde.app"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-artifacts
          path: dist/
          if-no-files-found: error

  # ── Publish GitHub Release ────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs: [validate-tag, validate-code, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Build update signer before exposing its key
        run: cargo build --manifest-path tools/update-signing/Cargo.toml --locked --release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: '*-artifacts'
          merge-multiple: true

      - name: List release artifacts
        run: ls -lh dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip *.deb *.msi *.AppImage *.dmg *.exe recorde-*-linux-x86_64 > SHA256SUMS

      - name: Sign and verify authenticated updates
        env:
          RECORDE_UPDATE_SIGNING_KEY: ${{ secrets.RECORDE_UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: python3 scripts/sign_release_updates.py --signer tools/update-signing/target/release/recorde-update-signing --keys packaging/update-keys.json --key-id recorde-2026-01 --version "$VERSION" --artifacts dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Recorde ${{ needs.validate-tag.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.msi
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
            dist/recorde-*-linux-x86_64
            dist/recorde-update-*.json
            dist/SHA256SUMS
