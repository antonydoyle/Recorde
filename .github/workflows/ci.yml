name: CI

# Pull requests run the Linux checks and the dependency audit. Windows and macOS
# (billed at 2x and 10x on private repositories) run on manual runs: use
# Actions > CI > Run workflow on a branch or main. Releases require a passing
# manual run for the tagged commit instead of running the suite again.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces its unfinished run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Reject vulnerable and unsound dependencies
        run: cargo audit --deny unsound
      - name: Audit standalone update signer dependencies
        run: cargo audit --file tools/update-signing/Cargo.lock --deny unsound
      - name: Validate standalone signature protocol
        run: cargo test --manifest-path tools/update-signing/Cargo.toml --locked
      - name: Audit privileged installer dependencies
        run: cargo audit --file tools/update-installer/Cargo.lock --deny unsound
      - name: Validate privileged installer without root
        env:
          CARGO_BUILD_JOBS: '1'
          RUST_TEST_THREADS: '1'
        run: |
          cargo fmt --manifest-path tools/update-installer/Cargo.toml --all --check
          python3 scripts/linux_task.py --purpose 'Privileged installer offline fixtures' --artifacts "$RUNNER_TEMP/process-safety" --timeout 600 -- cargo test --manifest-path tools/update-installer/Cargo.toml --locked
  test:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_TERMINAL_PROMPT: '0'
      # Native Git-heavy fixtures otherwise oversubscribe Windows process/IO limits.
      RUST_TEST_THREADS: '1'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check subprocess launch rules
        run: python scripts/check_process_safety.py
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Verify Windows task cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows_task_selftest.ps1 -Artifacts "$env:RUNNER_TEMP/process-safety"
      - name: Verify Linux task cleanup
        if: runner.os == 'Linux'
        run: python3 scripts/linux_task_selftest.py "$RUNNER_TEMP/process-safety"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev libgtk-3-dev \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libxtst6 git-lfs xvfb
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Set isolated Git defaults
        shell: bash
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/recorde-test-gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --file "$GIT_CONFIG_GLOBAL" user.name 'Recorde Tests'
          git config --file "$GIT_CONFIG_GLOBAL" user.email 'tests@example.invalid'
          git config --file "$GIT_CONFIG_GLOBAL" commit.gpgsign false
          git config --file "$GIT_CONFIG_GLOBAL" core.autocrlf false
          git config --file "$GIT_CONFIG_GLOBAL" init.defaultBranch main
      - name: Check all targets
        if: runner.os == 'macOS'
        run: cargo check --locked --all-targets
      - name: Clippy
        if: runner.os == 'macOS'
        run: cargo clippy --locked --all-targets
      - name: Test
        if: runner.os == 'macOS'
        run: cargo test --locked --all-targets
      - name: Windows checks in bounded jobs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($operation in @('check', 'clippy')) {
            ./scripts/windows_task.ps1 -Executable cargo -Arguments @($operation, '--locked', '--all-targets') -Purpose "CI cargo $operation" -Artifacts "$env:RUNNER_TEMP/process-safety" -TimeoutSeconds 1200 -MaxMemoryMiB 8192
          }
          ./scripts/windows_task.ps1 -Executable cargo -Arguments @('test', '--locked', '--lib', '--test', 'git_integration', '--test', 'credential_helper') -Purpose 'CI unique unit and integration tests' -Artifacts "$env:RUNNER_TEMP/process-safety" -TimeoutSeconds 1800
          ./scripts/windows_task.ps1 -Executable cargo -Arguments @('test', '--locked', '--bin', 'recorde') -Purpose 'CI binary process safety' -Artifacts "$env:RUNNER_TEMP/process-safety" -TimeoutSeconds 300
      - name: Linux checks in bounded tasks
        if: runner.os == 'Linux'
        run: |
          for operation in check clippy; do
            python3 scripts/linux_task.py --purpose "CI cargo $operation" --artifacts "$RUNNER_TEMP/process-safety" --timeout 1200 -- cargo "$operation" --locked --all-targets
          done
          python3 scripts/linux_task.py --purpose 'CI unique unit and integration tests' --artifacts "$RUNNER_TEMP/process-safety" --timeout 1200 -- cargo test --locked --lib --test git_integration --test credential_helper
      - name: LFS round trip
        if: runner.os == 'Linux'
        run: python3 scripts/linux_task.py --purpose 'CI LFS round trip' --artifacts "$RUNNER_TEMP/process-safety" --timeout 300 -- cargo test --locked --lib lfs_stage_push_clone_round_trip -- --ignored
      - name: Authenticated LFS HTTP and failed downloads
        if: runner.os == 'Linux'
        run: python3 scripts/linux_task.py --purpose 'CI LFS network failures' --artifacts "$RUNNER_TEMP/process-safety" --timeout 300 -- cargo test --locked --lib authenticated_lfs_http_round_trip_and_failed_downloads -- --ignored
      - name: SSH commit signing round trip
        if: runner.os == 'Linux'
        run: python3 scripts/linux_task.py --purpose 'CI SSH signing' --artifacts "$RUNNER_TEMP/process-safety" --timeout 300 -- cargo test --locked --lib ssh_signed_commit_verifies_with_disposable_key -- --ignored
      - name: Windows LFS, signing and credential vault
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($fixture in @('lfs_stage_push_clone_round_trip', 'authenticated_lfs_http_round_trip_and_failed_downloads', 'ssh_signed_commit_verifies_with_disposable_key', 'native_vault_round_trip')) {
            ./scripts/windows_task.ps1 -Executable cargo -Arguments @('test', '--locked', '--lib', $fixture, '--', '--ignored') -Purpose "CI $fixture" -Artifacts "$env:RUNNER_TEMP/process-safety" -TimeoutSeconds 300
          }
      - name: Windows native UI and four-theme acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/windows_task.ps1 -Executable cargo -Arguments @('build', '--locked', '--features', 'ui-inspection', '--bin', 'recorde', '--example', 'inspect_ui') -Purpose 'CI GUI and development inspector build' -Artifacts "$env:RUNNER_TEMP/process-safety" -TimeoutSeconds 1200 -MaxMemoryMiB 8192
          ./scripts/windows_task.ps1 -Executable cargo -Arguments @('test', '--locked', '--features', 'ui-inspection', '--example', 'inspect_ui') -Purpose 'CI native inspector selectors' -Artifacts "$env:RUNNER_TEMP/process-safety" -TimeoutSeconds 180 -MaxMemoryMiB 8192
          # Hosted Windows runners expose legacy OpenGL without a GPU driver.
          # Pin and verify Mesa; deploy only beside the CI debug executable.
          $mesa = "$env:RUNNER_TEMP/recorde-mesa"
          New-Item -ItemType Directory -Force -Path $mesa | Out-Null
          $archive = "$mesa/mesa.7z"
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695') {
            throw 'Mesa archive checksum mismatch'
          }
          tar -xf $archive -C $mesa x64/opengl32.dll x64/libgallium_wgl.dll
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          Copy-Item "$mesa/x64/opengl32.dll", "$mesa/x64/libgallium_wgl.dll" target/debug/
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $env:LIBGL_ALWAYS_SOFTWARE = '1'
          foreach ($palette in @('classic', 'siege')) {
            foreach ($mode in @('dark', 'light')) {
              $smokeArgs = @('-NoProfile', '-File', './scripts/windows_smoke.ps1', '-Binary', 'target/debug/recorde.exe', '-Inspector', 'target/debug/examples/inspect_ui.exe', '-Artifacts', "$env:RUNNER_TEMP/gui-artifacts/$palette-$mode", '-ThemePalette', $palette, '-InspectAccessibility', '-Review')
              if ($mode -eq 'light') { $smokeArgs += '-Light' }
              ./scripts/windows_task.ps1 -Executable pwsh -Arguments $smokeArgs -Purpose "CI native UI $palette $mode" -Artifacts "$env:RUNNER_TEMP/process-safety" -TimeoutSeconds 180
            }
          }
          ./scripts/windows_task.ps1 -Executable pwsh -Arguments @('-NoProfile', '-File', './scripts/windows_smoke.ps1', '-Binary', 'target/debug/recorde.exe', '-Inspector', 'target/debug/examples/inspect_ui.exe', '-Artifacts', "$env:RUNNER_TEMP/gui-artifacts/clean-history", '-Review', '-CleanTracked', '-InspectAccessibility') -Purpose 'CI native clean history confirmations' -Artifacts "$env:RUNNER_TEMP/process-safety" -TimeoutSeconds 180
      - name: Upload Windows process ledgers
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-process-safety
          path: ${{ runner.temp }}/process-safety
      - name: Linux GUI startup
        if: runner.os == 'Linux'
        run: |
          python3 scripts/linux_task.py --purpose 'CI GUI build' --artifacts "$RUNNER_TEMP/process-safety" --timeout 1200 -- cargo build --locked
          python3 scripts/linux_task.py --purpose 'CI GUI startup' --artifacts "$RUNNER_TEMP/process-safety" --timeout 120 -- python3 scripts/gui_smoke.py target/debug/recorde "$RUNNER_TEMP/gui-artifacts"
          for fixture in image-preview line-selection split-selection frame-profile repository-settings; do
            python3 scripts/linux_task.py --purpose "CI GUI $fixture" --artifacts "$RUNNER_TEMP/process-safety" --timeout 120 -- python3 scripts/gui_smoke.py target/debug/recorde "$RUNNER_TEMP/gui-artifacts/$fixture" "--$fixture"
          done
      - name: Linux native accessibility and display scales
        if: runner.os == 'Linux'
        run: |
          python3 scripts/linux_task.py --purpose 'Build development UI inspector' --artifacts "$RUNNER_TEMP/process-safety" --timeout 1200 -- cargo build --locked --features ui-inspection --bin recorde --example inspect_ui
          python3 scripts/linux_task.py --purpose 'Native inspector selectors' --artifacts "$RUNNER_TEMP/process-safety" --timeout 180 -- cargo test --locked --features ui-inspection --example inspect_ui
          export RECORDE_UI_INSPECTOR="$GITHUB_WORKSPACE/target/debug/examples/inspect_ui"
          for dpi in 1 1.25 1.5 2; do
            for palette in classic siege; do
              for theme in dark light; do
                args=()
                if [[ "$theme" == light ]]; then args+=(--light); fi
                if [[ "$palette" == siege ]]; then args+=(--siege); fi
                python3 scripts/linux_task.py --purpose "UI accessibility $palette $theme $dpi" --artifacts "$RUNNER_TEMP/process-safety" --timeout 180 -- python3 scripts/gui_smoke.py target/debug/recorde "$RUNNER_TEMP/gui-artifacts/accessibility-$palette-$theme-$dpi" --design-review --review "--dpi=$dpi" "${args[@]}"
              done
            done
          done
      - name: Upload Linux process ledgers
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-process-safety
          path: ${{ runner.temp }}/process-safety
      - name: Upload GUI smoke artifacts
        if: always() && (runner.os == 'Linux' || runner.os == 'Windows')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gui-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/gui-artifacts
